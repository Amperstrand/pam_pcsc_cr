name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev libsqlite3-dev libssl-dev libgcrypt20-dev pandoc autoconf automake libtool pkg-config gcc make

      - name: Run autogen.sh
        run: ./autogen.sh

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Run tests
        run: make check
        continue-on-error: false
